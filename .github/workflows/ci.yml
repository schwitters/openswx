name: CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            cxx: g++
            build_type: Release
            cxx_flags: ""
            exe_linker_flags: ""
            shared_linker_flags: ""
          - name: clang
            cc: clang
            cxx: clang++
            build_type: Release
            cxx_flags: ""
            exe_linker_flags: ""
            shared_linker_flags: ""
          - name: clang-asan
            cc: clang
            cxx: clang++
            build_type: Debug
            cxx_flags: "-fsanitize=address -fno-omit-frame-pointer"
            exe_linker_flags: "-fsanitize=address"
            shared_linker_flags: "-fsanitize=address"
          - name: clang-ubsan
            cc: clang
            cxx: clang++
            build_type: Debug
            cxx_flags: "-fsanitize=undefined -fno-omit-frame-pointer"
            exe_linker_flags: "-fsanitize=undefined"
            shared_linker_flags: "-fsanitize=undefined"

    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            curl \
            git \
            libasio-dev \
            libpugixml-dev \
            libsqlite3-dev \
            libzip-dev \
            libz-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.exe_linker_flags }}"
          -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.shared_linker_flags }}"
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
